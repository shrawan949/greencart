
---
- name: Install Kubernetes components
  hosts: kubernetes
  become: true

  tasks:
    - name: Add Kubernetes v1.36 repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes stable v1.36
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.36/rpm/
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.36/rpm/repodata/repomd.xml.key

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

