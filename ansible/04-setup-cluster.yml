
---
- name: Initialize Kubernetes master
  hosts: kubernetes-master
  become: true

  tasks:
    - name: Initialize the Kubernetes control plane
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --apiserver-advertise-address=172.31.41.214
          - --pod-network-cidr=10.244.0.0/16
          - --cri-socket=unix:///run/containerd/containerd.sock
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ec2-user/.kube/config
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: "0600"

    - name: Install Flannel network plugin
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Generate worker join command
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --print-join-command
      register: join_command
      changed_when: true

- name: Join Kubernetes workers
  hosts: kubernetes-worker
  become: true

  tasks:
    - name: Join worker to Kubernetes cluster
      ansible.builtin.shell: >-
        {{ hostvars['k8s-master']['join_command']['stdout'] }}
        --cri-socket=unix:///run/containerd/containerd.sock
      args:
        creates: /etc/kubernetes/kubelet.conf

