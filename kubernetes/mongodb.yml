apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: greencart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greencart-mongodb
  template:
    metadata:
      labels:
        app: greencart-mongodb
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1.example.com
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: greencart-secrets
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greencart-secrets
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: greencart-mongodb-pvc

