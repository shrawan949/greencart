apiVersion: apps/v1
kind: Deployment
metadata:
  name: greencart-frontend
  namespace: greencart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greencart-frontend
  template:
    metadata:
      labels:
        app: greencart-frontend
    spec:
      containers:
        - name: frontend
          image: shrawanambarte0101/greencart-frontend:1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
