apiVersion: v1
kind: PersistentVolume
metadata:
  name: greencart-mongodb-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-greencart
  hostPath:
    path: /mnt/data/greencart-mongodb
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node1.example.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: greencart-mongodb-pvc
  namespace: greencart
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-greencart
  volumeName: greencart-mongodb-pv
  resources:
    requests:
      storage: 5Gi
