apiVersion: v1
kind: Secret
metadata:
  name: greencart-secrets
  namespace: greencart
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: "greencartadmin"
  MONGO_ROOT_PASSWORD: "REPLACE_WITH_GENERATED_PASSWORD"
  MONGODB_URI: "REPLACE_WITH_GENERATED_MONGODB_URI"
  JWT_SECRET: "REPLACE_WITH_GENERATED_JWT_SECRET"
